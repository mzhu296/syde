<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SYDE 572 course project portfolio">
  <title>SYDE 572 Projects</title>
  <style>
    :root {
      --navy: #071728;
      --navy-light: #114b63;
      --teal: #159a91;
      --text: #d8e4ef;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: white;
      background:
        radial-gradient(circle at 85% 15%, rgba(21, 154, 145, .34), transparent 28rem),
        linear-gradient(135deg, var(--navy), var(--navy-light));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(30px, 6vw, 58px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #8ee2db;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
      letter-spacing: -.055em;
    }

    p {
      margin: 22px 0 30px;
      color: var(--text);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      padding: 13px 18px;
      border-radius: 11px;
      color: white;
      background: var(--teal);
      font-weight: 800;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    a:hover, a:focus-visible {
      background: #1cb3a8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">University of Waterloo · SYDE 572</p>
    <h1>Course projects</h1>
    <p>
      Assignment 1 explores shortest-distance optimization, numerical methods,
      and least-squares function fitting.
    </p>
    <a href="./assignment1/ieee.html">Open Assignment 1 →</a>
  </main>
</body>
</html>
